name: saitamarobot
services:
  - name: saitama-worker
    build:
      dockerfile: Dockerfile
      context: .
    env:
      APP_ID: ${APP_ID}
      API_HASH: ${API_HASH}
      TOKEN: ${TOKEN}
      OWNER_ID: ${OWNER_ID}
      STRING_SESSION: ${STRING_SESSION}
      OWNER_USERNAME: ${OWNER_USERNAME}
      DB_URI: ${DATABASE_URL}   # Make sure config.py uses DB_URI or DATABASE_URL consistently
      MESSAGE_DUMP: ${MESSAGE_DUMP}
      GBAN_LOGS: ${GBAN_LOGS}
      SYS_ADMIN: ${SYS_ADMIN}
      DEV_USERS: ${DEV_USERS}
      LOAD: ${LOAD}
      BAN_STICKER: ${BAN_STICKER}
      CASH_API_KEY: ${CASH_API_KEY}
      TIME_API_KEY: ${TIME_API_KEY}
      WALL_API: ${WALL_API}
      SPAMWATCH_API: ${SPAMWATCH_API}
      SPAMMERS: ${SPAMMERS}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      CF_API_KEY: ${CF_API_KEY}
      BOT_API_URL: ${BOT_API_URL}
      BOT_API_FILE_URL: ${BOT_API_FILE_URL}
    run_command: python3 -m SaitamaRobot
